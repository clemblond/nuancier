<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuancier — générateur de palettes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#1a1a2e; --paper:#fbfbf8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { font-family:"Bricolage Grotesque", system-ui, sans-serif; background:var(--paper); color:var(--ink); display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.5rem; flex-wrap:wrap; }
  h1 { font-size:1.25rem; font-weight:700; }
  header p { font-size:.95rem; opacity:.7; }
  kbd { font-family:inherit; border:1px solid currentColor; border-radius:4px; padding:0 .35em; }
  main { flex:1; display:flex; min-height:0; }
  .swatch { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-start; padding:1.5rem; transition:flex .3s ease, background-color .4s ease; }
  .swatch:hover { flex:1.4; }
  .hex { font-size:clamp(1.4rem, 3vw, 2.6rem); font-weight:700; letter-spacing:-.02em; background:none; border:0; color:inherit; cursor:pointer; font-family:inherit; }
  .lock { margin-top:.5rem; font:inherit; font-size:.9rem; background:none; border:1px solid currentColor; color:inherit; border-radius:999px; padding:.25rem .8rem; cursor:pointer; opacity:.8; }
  .lock[aria-pressed="true"] { opacity:1; font-weight:700; }
  button:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
  footer { padding:1rem 1.5rem; }
  #regen { font:inherit; font-weight:700; font-size:1rem; background:var(--ink); color:var(--paper); border:0; border-radius:8px; padding:.75rem 1.4rem; cursor:pointer; }
  #toast { position:fixed; bottom:1.25rem; right:1.5rem; background:var(--ink); color:var(--paper); padding:.6rem 1rem; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  @media (max-width:640px) { main { flex-direction:column; } .swatch { flex-direction:row; justify-content:space-between; align-items:center; padding:1rem 1.25rem; } .lock { margin-top:0; } }
  @media (prefers-reduced-motion:reduce) { .swatch { transition:none; } }
</style>
</head>
<body>
<header>
  <h1>Nuancier</h1>
  <p>Appuie sur <kbd>Espace</kbd> pour une nouvelle palette. Clique un code pour le copier.</p>
</header>
<main id="palette"></main>
<footer><button id="regen">Générer une palette</button></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
  const COUNT = 5;
  const palette = document.getElementById('palette');
  const toast = document.getElementById('toast');
  let colors = Array.from({length:COUNT}, () => ({hex:'#000000', locked:false}));

  function hslToHex(h, s, l) {
    s/=100; l/=100;
    const k = n => (n + h/30) % 12, a = s*Math.min(l,1-l);
    const f = n => Math.round(255*(l - a*Math.max(-1, Math.min(k(n)-3, 9-k(n), 1)))).toString(16).padStart(2,'0');
    return ('#'+f(0)+f(8)+f(4)).toUpperCase();
  }
  function isLight(hex) {
    const [r,g,b] = [1,3,5].map(i => parseInt(hex.slice(i,i+2),16));
    return (r*299 + g*587 + b*114)/1000 > 150;
  }
  function generate() {
    const base = Math.random()*360;
    colors = colors.map((c,i) => c.locked ? c : ({
      hex: hslToHex((base + i*(25 + Math.random()*20)) % 360, 45 + Math.random()*40, 25 + i*12 + Math.random()*8),
      locked:false
    }));
    render();
  }
  function render() {
    palette.innerHTML = '';
    colors.forEach((c,i) => {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.style.backgroundColor = c.hex;
      el.style.color = isLight(c.hex) ? '#1a1a2e' : '#fbfbf8';
      el.innerHTML = `<button class="hex" aria-label="Copier ${c.hex}">${c.hex}</button>
        <button class="lock" aria-pressed="${c.locked}">${c.locked ? 'Verrouillée' : 'Verrouiller'}</button>`;
      el.querySelector('.hex').onclick = () => copy(c.hex);
      el.querySelector('.lock').onclick = () => { colors[i].locked = !colors[i].locked; render(); };
      palette.appendChild(el);
    });
  }
  async function copy(hex) {
    try { await navigator.clipboard.writeText(hex); show(hex + ' copié'); }
    catch { show('Copie impossible — sélectionne le code à la main'); }
  }
  function show(msg) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 1400); }
  document.getElementById('regen').onclick = generate;
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); generate(); } });
  generate();
</script>
</body>
</html>
